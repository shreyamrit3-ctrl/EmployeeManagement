
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - EmployeeAPI/**

pool:
  name: Default

variables:
  buildConfiguration: 'Release'

steps:
- checkout: self
  clean: true

- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet Packages'
  inputs:
    command: 'restore'
    projects: 'EmployeeAPI/EmployeeAPI.csproj'

- task: DotNetCoreCLI@2
  displayName: 'Build Employee API'
  inputs:
    command: 'build'
    projects: 'EmployeeAPI/EmployeeAPI.csproj'
    arguments: '--configuration $(buildConfiguration) --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Publish Employee API'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: 'EmployeeAPI/EmployeeAPI.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish'
    zipAfterPublish: true

- task: AzureWebApp@1
  displayName: 'Deploy Employee API to Azure'
  inputs:
    azureSubscription: 'EmployeeManagement-ServiceConnection'
    appType: 'webApp'
    appName: 'employee-management-api'
    package: '$(Build.ArtifactStagingDirectory)/publish/EmployeeAPI.zip'
