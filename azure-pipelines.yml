
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - EmployeeAPI/**

pool:
  name: Default

variables:
  buildConfiguration: 'Release'

steps:
- checkout: self
  clean: true

# Step 1: Verify installed .NET SDK
- powershell: |
    Write-Host "Checking installed .NET SDK..."
    dotnet --version
    dotnet --list-sdks
  displayName: 'Verify Installed .NET SDK'

# Step 2: Restore NuGet packages
- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet Packages'
  inputs:
    command: 'restore'
    projects: 'EmployeeAPI/EmployeeAPI.csproj'

# Step 3: Build API
- task: DotNetCoreCLI@2
  displayName: 'Build Employee API'
  inputs:
    command: 'build'
    projects: 'EmployeeAPI/EmployeeAPI.csproj'
    arguments: '--configuration $(buildConfiguration) --no-restore'

# Step 4: Publish API
- task: DotNetCoreCLI@2
  displayName: 'Publish Employee API'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: 'EmployeeAPI/EmployeeAPI.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish'
    zipAfterPublish: true

# Step 5: Deploy API to Azure App Service
- task: AzureWebApp@1
  displayName: 'Deploy Employee API to Azure'
  inputs:
    azureSubscription: 'EmployeeManagement-ServiceConnection'
    appType: 'webApp'
    appName: 'employee-management-api'
    package: '$(Build.ArtifactStagingDirectory)/publish/**/*.zip'
